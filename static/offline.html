<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کافه کلاب</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #05060c; color: #f4efe6; font-family: Tahoma, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    h1 { font-size: 1.3rem; margin: 0 0 10px; }
    p { margin: 0 0 18px; line-height: 1.8; color: #d5c7b0; }
    button {
      min-height: 44px; padding: 0 22px; border: 0; border-radius: 12px;
      font: inherit; font-weight: 700; color: #1a140c;
      background: linear-gradient(180deg, #e0c48a, #b48a4a); cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <div>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>اتصال اینترنتتان را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="if(window.CafeClub&amp;&amp;CafeClub.retry){CafeClub.retry()}else{location.reload()}">تلاش مجدد</button>
    </div>
  </main>
</body>
</html>
