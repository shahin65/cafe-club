{% load i18n %}
{% if can_pin_scenario %}
  <form class="pin-home" method="post" action="{% url 'scenario_pin' scenario.id %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="{% if scenario_pinned %}is-pinned{% endif %}">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 21s-6.7-4.35-9.33-8.2C.7 9.7 2.2 6 5.6 6c1.9 0 3.1 1.1 3.9 2.2C10.3 7.1 11.5 6 13.4 6c3.4 0 4.9 3.7 2.93 6.8C18.7 16.65 12 21 12 21Z"/>
      </svg>
      <span>{% trans "اضافه به صفحه اصلی" %}</span>
    </button>
  </form>
{% endif %}
