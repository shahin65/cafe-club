{% extends "admin/change_form.html" %}

{% block extrahead %}
{{ block.super }}
<datalist id="iran-cities">
  {% for city in iran_cities %}
    <option value="{{ city }}"></option>
  {% endfor %}
</datalist>
{% endblock %}

{% block after_field_sets %}
  <div class="venue-map-card">
    <h2>ثبت موقعیت روی نقشه</h2>
    <p>نقشه را جابه‌جا کنید و روی محل کافه کلیک کنید. سنجاق را هم می‌توانید بکشید.</p>
    <div id="venue-map" data-default-lat="35.6892" data-default-lng="51.3890"></div>
  </div>
  {{ block.super }}
{% endblock %}
