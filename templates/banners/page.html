{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ page.title }} | {% trans "کافه کلاب" %}{% endblock %}

{% block content %}
  <article class="sheet">
    <h1>{{ page.title }}</h1>
    <p{% if page.coming_soon %} class="coming-soon"{% endif %}>{{ page.body }}</p>
    <a class="button" href="{% url 'home' %}">{% trans "بازگشت به خانه" %}</a>
  </article>
{% endblock %}
