{% load i18n static %}
<nav class="tab-bar" aria-label="{% trans 'نوار پایین' %}">
  <a class="tab{% if request.resolver_match.url_name == 'ads' %} is-active{% endif %}" href="{% url 'ads' %}" {% if request.resolver_match.url_name == 'ads' %}aria-current="page"{% endif %}>
    <img src="{% static 'Icon-Advertisement.png' %}" alt="" width="36" height="36">
    <span>{% trans "آگهی" %}</span>
  </a>
  <a class="tab{% if request.resolver_match.url_name == 'home' %} is-active{% endif %}" href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>
    <img src="{% static 'Icon-Home.png' %}" alt="" width="44" height="44">
    <span>{% trans "خانه" %}</span>
  </a>
  <a class="tab{% if request.resolver_match.url_name == 'location' %} is-active{% endif %}" href="{% url 'location' %}" {% if request.resolver_match.url_name == 'location' %}aria-current="page"{% endif %}>
    <img src="{% static 'Icon-Location.png' %}" alt="" width="36" height="36">
    <span>{% trans "مکان" %}</span>
  </a>
</nav>
