plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def quotedBuildConfig = { value ->
    def escaped = (value ?: "").replace("\\", "\\\\").replace("\"", "\\\"").replace("\r", "").replace("\n", "")
    return "\"${escaped}\""
}

android {
    namespace "ir.cafeclub.amytis"
    compileSdk 35

    defaultConfig {
        applicationId "ir.cafeclub.amytis"
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName "1.0.4"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    flavorDimensions "channel"
    productFlavors {
        direct {
            dimension "channel"
            buildConfigField "String", "START_URL", '"https://cafeclub.amytisapp.ir/app/direct/"'
            buildConfigField "String", "APP_SOURCE", '"direct"'
        }
        bazaar {
            dimension "channel"
            buildConfigField "String", "START_URL", '"https://cafeclub.amytisapp.ir/app/bazaar/"'
            buildConfigField "String", "APP_SOURCE", '"bazaar"'
            buildConfigField "String", "BAZAAR_RSA", quotedBuildConfig(keystoreProperties["bazaarRsa"])
        }
        myket {
            dimension "channel"
            buildConfigField "String", "START_URL", '"https://cafeclub.amytisapp.ir/app/myket/"'
            buildConfigField "String", "APP_SOURCE", '"myket"'
            buildConfigField "String", "MYKET_RSA", quotedBuildConfig(keystoreProperties["myketRsa"])
            manifestPlaceholders = [
                marketApplicationId: "ir.mservices.market",
                marketBindAddress  : "ir.mservices.market.InAppBillingService.BIND",
                marketPermission   : "ir.mservices.market.BILLING",
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.google.android.material:material:1.12.0"
    bazaarImplementation "com.github.cafebazaar.Poolakey:poolakey:2.2.0"
    myketImplementation "ir.myket:billing:2.2"
}
